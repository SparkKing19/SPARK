server:
  port: 2333
  address: 127.0.0.1

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:change-this-in-railway}"
    sources:
      youtube: false
      soundcloud: true
      bandcamp: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    youtubePlaylistLoadLimit: 6
    playerUpdateInterval: 5
    gc-warnings: true

plugins:
  - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    snapshot: false

logging:
  level:
    root: INFO
    lavalink: INFO